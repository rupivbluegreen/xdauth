name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpam0g-dev
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: gofmt -l . | tee /tmp/fmt.out && test ! -s /tmp/fmt.out
      - run: go test ./... -race -cover

  lint:
    runs-on: ubuntu-latest
    # non-blocking: golangci-lint's latest release can't yet read go1.26's export data format (x/crypto's CVE fixes require go1.26, so downgrading it to dodge this isn't an option); flip continue-on-error off once golangci-lint catches up
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpam0g-dev
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go mod download
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall # the prebuilt binary can lag the module's go directive and refuse to run; goinstall builds it with the runner's own toolchain instead
          skip-cache: true # a stale cache from an earlier broken tree can corrupt module resolution

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpam0g-dev
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpam0g-dev
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - run: gosec ./...

  compose-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose/compose.yaml up -d --build
      - run: bash deploy/compose/smoke-test.sh
      - if: always()
        run: docker compose -f deploy/compose/compose.yaml logs
      - if: always()
        run: docker compose -f deploy/compose/compose.yaml down -v
