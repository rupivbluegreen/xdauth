version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - gocritic
    - gosec

  exclusions:
    paths:
      - deploy
      # experimental, not working (docs/native-pam-status.md); gocritic
      # misreads its cgo pointer comparisons as duplicate subexpressions.
      - cmd/xdauth-pam-native
