services:
  # dex and broker share the host's network namespace: dex's single "issuer" URL must be reachable
  # both by the broker (server-to-server) and by the user's browser, and container bridge networking
  # cannot make one hostname:port resolve identically in both places without extra host-side setup.
  # Host networking is Linux-only; this demo targets a Linux Docker host.
  dex:
    image: dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    network_mode: host
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro

  broker:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      - dex
    network_mode: host
    environment:
      XDAUTH_LISTEN_ADDR: ":8080"
      XDAUTH_BASE_URL: "http://localhost:8080"
      XDAUTH_ISSUER_URL: "http://localhost:5556/dex"
      XDAUTH_CLIENT_ID: "xdauth"
      XDAUTH_CLIENT_SECRET: "xdauth-secret"
      XDAUTH_IDENTITY_CLAIM: "email"
      XDAUTH_SCOPES: "openid,email,profile"

  # host networking, not a bridge + host.docker.internal: reaching the host-networked broker from a
  # bridge-networked container through host-gateway routing is slow/unreliable in some Docker setups
  # (observed hanging past the client library's own 10s HTTP timeout with no error surfaced at all).
  # Same network namespace as broker sidesteps the indirection entirely.
  sshd:
    build:
      context: ../..
      dockerfile: deploy/compose/sshd/Dockerfile
    depends_on:
      - broker
    network_mode: host

  # alternative SSH demo: a custom golang.org/x/crypto/ssh server instead of stock sshd + pam_exec, see docs/gossh-server.md
  xdauth-sshd:
    build:
      context: ../..
      dockerfile: deploy/compose/xdauth-sshd/Dockerfile
    depends_on:
      - broker
    network_mode: host
    environment:
      XDAUTH_SSHD_LISTEN_ADDR: ":2323"
      XDAUTH_BROKER_URL: "http://localhost:8080"
